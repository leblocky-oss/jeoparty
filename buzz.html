:root{--felt:#10251A;--felt-2:#173728;--line:#2F6049;--coral:#E25C54;--coral-deep:#A63A35;--chalk:#F6EFE2;--mint:#A6E3C4;--amber:#F4C24F;--muted:#A3BCAE;--ink:#0C1D15;
  --display:"Bungee","Arial Black",Impact,sans-serif;--body:"Archivo","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--felt);color:var(--chalk);font-family:var(--body);display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));-webkit-tap-highlight-color:transparent;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font:400 1.4rem/1 var(--display);color:var(--coral)}
.pill{font:700 .75rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--line);border-radius:99px;padding:.45em .8em;color:var(--muted)}
.pill.on{color:var(--ink);background:var(--mint);border-color:var(--mint)}
main{display:grid;place-items:center;align-content:center;gap:18px;text-align:center;min-height:0}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,420px)}
.teams button{font:700 1.05rem/1.2 var(--body);padding:1.1em .6em;border-radius:14px;border:2px solid var(--line);background:var(--felt-2);color:var(--chalk)}
body{background:radial-gradient(120% 70% at 50% 45%,color-mix(in srgb,var(--tc,#3c4a43) 22%,var(--felt)) 0%,var(--felt) 70%);transition:background .3s}
.team-name{margin:0;font:400 clamp(1.6rem,9vw,2.8rem)/1 var(--display);color:var(--tc,var(--chalk));text-shadow:0 0 24px color-mix(in srgb,var(--tc,#fff) 50%,transparent)}
.ring{position:relative;width:min(80vw,58vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 0deg,#2a3530,#1a221e,#2a3530,#1a221e,#2a3530);box-shadow:inset 0 0 0 8px #0b120e,0 18px 40px rgba(0,0,0,.5)}
#big{width:82%;aspect-ratio:1;border-radius:50%;border:0;font:400 clamp(2rem,11vw,4.2rem)/1 var(--display);color:rgba(255,255,255,.55);letter-spacing:.04em;
  background:radial-gradient(circle at 35% 30%,#7d8b84,#4a5751 60%,#36413c);box-shadow:0 12px 0 #232c28,inset 0 -10px 20px rgba(0,0,0,.35);transition:transform 70ms,box-shadow 70ms,filter .2s}
#big.live{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 55%,#fff),var(--tc) 55%,color-mix(in srgb,var(--tc) 70%,#000));
  box-shadow:0 12px 0 color-mix(in srgb,var(--tc) 55%,#000),inset 0 -10px 20px rgba(0,0,0,.25),0 0 50px var(--tc);animation:pulse 900ms ease-in-out infinite}
#big.live:active{transform:translateY(10px);box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 70px var(--tc)}
.ring.live{animation:spin 3s linear infinite;background:conic-gradient(from 0deg,var(--tc),transparent 25%,var(--tc) 50%,transparent 75%,var(--tc))}
.ring.live #big{animation:pulse 900ms ease-in-out infinite,unspin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes unspin{to{transform:rotate(-360deg)}}
#big.won{color:#10151A;background:radial-gradient(circle at 35% 30%,#fff,var(--tc) 60%);box-shadow:0 12px 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 80px var(--tc)}
body.flash{animation:flash .6s ease-out 2}
@keyframes flash{30%{background:var(--tc)}}
.other{display:inline-block;padding:.15em .5em;border-radius:8px;background:var(--oc);color:#10151A}
.teams button{border-left:8px solid var(--tc)!important}
@keyframes pulse{50%{filter:brightness(1.18) saturate(1.1)}}
#msg{margin:0;font:700 clamp(1.1rem,5vw,1.6rem)/1.3 var(--body);min-height:2.6em;max-width:22ch}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
#nm{width:min(100%,360px);font:700 1.3rem/1.2 var(--body);padding:.6em .8em;border-radius:12px;border:2px solid var(--tc,var(--line));background:var(--felt-2);color:var(--chalk);text-align:center}
.row{display:flex;gap:10px;justify-content:center}.row button{font:700 1.05rem/1 var(--body);padding:.8em 1.4em;border-radius:12px;border:2px solid var(--line);background:var(--felt-2);color:var(--chalk)}
.row button.ok{background:var(--tc,var(--mint));border-color:var(--tc,var(--mint));color:#10151A}
.tip{margin:0;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
.lifebtn{display:flex;align-items:center;gap:12px;background:var(--felt-2);border:2px solid var(--amber);border-radius:16px;padding:8px 16px 8px 8px;color:var(--chalk);font:inherit;text-align:left}
.lifebtn img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.lifebtn b{display:block;font:400 1.15rem/1.1 var(--display);color:var(--amber)}.lifebtn small{font-size:.85rem;color:var(--muted)}
.lifeask{display:grid;gap:10px;justify-items:center;font-weight:700}.lifeask p{margin:0}
footer button{background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;padding:.4em .7em;font:inherit}
@media (prefers-reduced-motion:reduce){#big.live,.ring.live,.ring.live #big,body.flash{animation:none}}

try { const t = localStorage.getItem(KEY); if (t !== null && /^[0-7]$/.test(t)) team = +t; } catch (e) {}

function show(nodes) { $('#main').replaceChildren(...nodes); }
if (!room) { show([el('p', { id: 'msg', text: 'This link is missing its game code. Scan the QR code on the screen again.' })]); return; }
try { db = firebase.initializeApp(FB).database(); } catch (e) { show([el('p', { id: 'msg', text: 'Could not connect. Check the internet and reload.' })]); return; }

db.ref('.info/connected').on('value', s => { const on = !!s.val(); $('#net').textContent = on ? 'Connected' : 'Offline'; $('#net').classList.toggle('on', on); if (on) join(); });
db.ref(`rooms/${room}/state`).on('value', s => { state = s.val(); render(); });

function join() {
  if (team === null || !db) return;
  if (presence) presence.onDisconnect().cancel();
  presence = db.ref(`rooms/${room}/phones/${team}`);
  presence.onDisconnect().remove();
  presence.set({ at: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
}
function unlock() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
    const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) {}
}
function buzzFeel(ms) {   /* Android vibrates; iPhone (iOS 18+) gives a light tap through a hidden switch */
  try { if (navigator.vibrate && navigator.vibrate(ms)) return; } catch (e) {}
  try { document.getElementById('hapl').click(); } catch (e) {}
}
document.addEventListener('pointerdown', unlock, { passive: true });
document.addEventListener('touchend', unlock, { passive: true });
function pick(i) { beep([[660, 0, .08], [990, .08, .12]]); team = i; try { localStorage.setItem(KEY, String(i)); } catch (e) {} join(); render(); }
let renaming = false;
$('#rename').addEventListener('click', () => { renaming = true; render(); });
function renameView(cur) {
  const input = el('input', { id: 'nm', type: 'text', maxlength: '24', value: cur, 'aria-label': 'Team name', autocomplete: 'off' });
  const save = () => { const v = input.value.trim().slice(0, 24); if (v) db.ref(`rooms/${room}/names/${team}`).set(v).catch(() => {}); renaming = false; render(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  setTimeout(() => input.focus(), 50);
  return [el('p', { id: 'msg', text: 'Pick a team name (up to 24 letters)' }), input,
    el('div', { class: 'row' }, el('button', { type: 'button', class: 'ok', text: 'Save', onclick: save }), el('button', { type: 'button', text: 'Cancel', onclick: () => { renaming = false; render(); } }))];
}
$('#change').addEventListener('click', () => { if (presence) { presence.onDisconnect().cancel(); presence.remove().catch(() => {}); presence = null; } team = null; try { localStorage.removeItem(KEY); } catch (e) {} render(); });

function press() {
  if (!state || !state.open || team === null || (state.locked || []).includes(team) || pressed === state.round) return;
  pressed = state.round;
  buzzFeel(90);
  beep([[147, 0, .3, 'square', .35], [110, 0, .3, 'sawtooth', .2]]);
  db.ref(`rooms/${room}/buzz/${state.round}/${team}`).set(firebase.database.ServerValue.TIMESTAMP).catch(() => {});
  render();
}
function render() {
  const names = (state && state.teams) || [];
  $('#change').hidden = team === null; $('#rename').hidden = team === null || renaming;
  $('#who').textContent = team === null ? `Game ${room}` : `${names[team] || 'Team ' + (team + 1)} · game ${room}`;
  if (team === null) {
    const n = names.length || 8;
    show([el('p', { id: 'msg', text: 'Which team is this phone for?' }), el('div', { class: 'teams' }, ...Array.from({ length: n }, (_, i) => { const b = el('button', { type: 'button', text: names[i] || 'Team ' + (i + 1), onclick: () => pick(i) }); b.style.setProperty('--tc', COLORS[i % 8]); return b; }))]);
    return;
  }
  if (renaming) { show(renameView(names[team] || 'Team ' + (team + 1))); return; }
  const s = state || {}, locked = (s.locked || []).includes(team), floor = typeof s.floor === 'number' ? s.floor : -1;
  document.body.style.setProperty('--tc', COLORS[team % 8]);
  if (floor !== lastFloor) {
    if (floor === team) { beep([[523, 0, .12], [659, .1, .12], [784, .2, .12], [1047, .3, .3]]); buzzFeel([120, 60, 120]); document.body.classList.remove('flash'); void document.body.offsetWidth; document.body.classList.add('flash'); }
    else if (floor >= 0 && lastFloor !== -2) beep([[330, 0, .12, 'square', .15], [262, .12, .2, 'square', .15]]);
    lastFloor = floor;
  }
  if (floor !== team || !s.life) lifeAsk = false;
  let cls = '', label = 'WAIT', msg = [document.createTextNode('Wait for the host to read the clue.')];
  if (floor === team) { cls = 'won'; label = 'YOU!'; msg = [document.createTextNode('You were first. Answer now!')]; }
  else if (floor >= 0) { const tag = el('span', { class: 'other', text: names[floor] || 'Team ' + (floor + 1) }); tag.style.setProperty('--oc', COLORS[floor % 8]); msg = [tag, document.createTextNode(' buzzed first.')]; }
  else if (s.open && locked) { msg = [document.createTextNode('Your team already had a go at this one.')]; }
  else if (s.open && pressed === s.round) { label = '…'; msg = [document.createTextNode('Buzzed! Checking who was first…')]; }
  else if (s.open) { cls = 'live'; label = 'BUZZ!'; msg = [document.createTextNode('Buzzers are open!')]; }
  const big = el('button', { id: 'big', type: 'button', class: cls, 'aria-label': 'Buzz', text: label });
  big.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  const p = el('p', { id: 'msg', role: 'status' }); p.append(...msg);
  const tipLine = el('p', { class: 'tip' }); tipLine.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg> No sound? Ringer on (not silent), volume up.';
  let life = null;
  if (floor === team && s.life) {
    const cost = s.lifeCost || 250;
    life = lifeAsk
      ? el('div', { class: 'lifeask' }, el('p', { text: `Use the lifeline? Your team loses ${cost} points.` }), el('div', { class: 'row' },
          el('button', { type: 'button', class: 'ok', text: `Yes, −${cost}`, onclick: () => { lifeAsk = false; db.ref(`rooms/${room}/life`).push({ team, at: firebase.database.ServerValue.TIMESTAMP }).catch(() => {}); beep([[523, 0, .1], [784, .1, .2]]); buzzFeel(60); render(); } }),
          el('button', { type: 'button', text: 'No', onclick: () => { lifeAsk = false; render(); } })))
      : el('button', { type: 'button', class: 'lifebtn', onclick: () => { lifeAsk = true; render(); } }, el('img', { src: CAT, alt: '' }), el('span', {}, el('b', { text: 'Lifeline' }), el('small', { text: `Get a hint for −${cost} points` })));
  }
  show([el('p', { class: 'team-name', text: names[team] || 'Team ' + (team + 1) }), el('div', { class: 'ring' + (cls === 'live' ? ' live' : '') }, big), p, life, tipLine].filter(Boolean));
}
try { if (navigator.wakeLock) { const w = () => navigator.wakeLock.request('screen').catch(() => {}); w(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') w(); }); } } catch (e) {}
render();
})();
</script>
